name: "Continuous Integration"

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: Check Nix formatting
        run: git ls-files -z '*.nix' | xargs -0 nix fmt -- --check
      - name: Lint workflow files
        run: nix run nixpkgs#actionlint

  evaluate:
    name: Evaluate all hosts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      # Evaluates every nixosConfiguration, including aarch64 skylab. Catches
      # merge conflicts, renamed options and platform errors without building
      # anything.
      - name: Evaluate
        run: nix flake check --no-build --keep-going

  build:
    name: Build ${{ matrix.host }}
    runs-on: ubuntu-latest
    needs: evaluate
    strategy:
      fail-fast: false
      matrix:
        host: [kirby, clay, aptenodytes, kneippweg]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      # Full closure build: catches unfree/insecure packages and build-time
      # failures that evaluation cannot see.
      - name: Build ${{ matrix.host }}
        run: nix build --keep-going --print-out-paths .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel
